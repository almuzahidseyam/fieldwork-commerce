name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_ENDPOINT: http://127.0.0.1:8879
      DYNAMODB_TABLE_NAME: fieldwork-ci
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8879:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Start application and test API
        run: |
          npm run start > /tmp/fieldwork.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/categories > /dev/null; then break; fi
            sleep 1
          done
          npm run test:integration
